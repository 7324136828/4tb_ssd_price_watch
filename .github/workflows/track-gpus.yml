name: Track GPU prices

on:
  schedule:
    - cron: "15 13 * * *"   # daily, 8:15 AM Eastern (EST), before the 9:00 routine
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/track_gpus.py
      - scripts/price_log.py
      - scripts/add_price.py
      - tests/**

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Check GPU prices
        if: github.event_name != 'pull_request'
        run: python scripts/track_gpus.py --write --json gpu-report.json

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # README dashboard is rebuilt here instead of by update-readme.yml.
      - name: Rebuild README dashboard
        if: github.event_name != 'pull_request'
        run: python scripts/build_readme.py

      - name: Commit new prices
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- prices.csv README.md; then
            echo "No new GPU prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add prices.csv README.md
          git commit -m "GPU price log $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-report
          path: gpu-report.json
          if-no-files-found: ignore
