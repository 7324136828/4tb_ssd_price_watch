name: Update README dashboard

on:
  push:
    branches: [main]
    paths:
      - prices.csv
      - scripts/build_readme.py
      - scripts/visualize_prices.py
      - .github/workflows/update-readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README from prices.csv
        run: python scripts/build_readme.py

      - name: Commit README if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README price dashboard"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build price visualization
        if: always()
        run: |
          mkdir -p dashboard
          python3 scripts/visualize_prices.py --no-open --out dashboard/price-dashboard.html \
            | tee dashboard/price-summary.txt
          python3 scripts/visualize_prices.py --terminal > dashboard/price-charts.txt
          {
            echo '### Price summary'
            echo 'Download the **price-dashboard** artifact and open `price-dashboard.html` in a browser.'
            echo '```'
            cat dashboard/price-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload price visualization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-dashboard
          path: dashboard/
          if-no-files-found: warn
          retention-days: 30
